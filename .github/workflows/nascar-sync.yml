name: NASCAR data sync

# Triggers /api/cron/sync-nascar on a tight cadence so the site can honor
# NASCAR's real publish windows (entry list Tue/Fri noon, starting grid up
# to 12h before green flag, finishing positions every ~20min for 2h after
# green flag) — see src/app/api/cron/sync-nascar/route.ts for the gating
# logic. This runs from GitHub Actions rather than Vercel Cron because the
# project is on Vercel's Hobby plan, which only allows cron jobs to fire
# once a day; vercel.json still carries a once-daily Vercel Cron entry as a
# fallback in case this workflow is ever disabled.
#
# GitHub's schedule trigger is best-effort — in practice, observed gaps
# between actual runs on this repo have been as wide as several hours, not
# the requested 15 minutes. The route's entry-list window (see
# ENTRY_WINDOW_MINUTES in src/lib/nascarSyncSchedule.ts — widened from 90
# minutes to the rest of the day for exactly this reason) can't always
# absorb that, so vercel.json carries two Vercel Cron entries as a backstop
# (reliable native infra): a general daily ping, plus one pinned to
# Tuesday/Friday 17:00 UTC specifically for the entry-list window.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://nascarapp.vercel.app/api/cron/sync-nascar"
