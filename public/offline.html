<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fantasy NASCAR HQ — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #2e2e2e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
        padding: 24px;
      }
      img {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #6b6b6b;
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        background: #2e2e2e;
        color: #ffffff;
        border: none;
        border-radius: 9px;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #121212; color: #f2f1ee; }
        p { color: #b9b8b4; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Fantasy NASCAR HQ needs a connection to load picks, standings, and results. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
